#? Config file for btop v.1.3.2

[options]
#* btop theme (name of a .theme file in the themes/ dir, spaces as underscores)
color_theme = "catppuccin_mocha"

#* Toggle for using the theme's background color
theme_background = True

#* Use truecolor (24-bit) instead of 256-color fallback
truecolor = True

#* Force 256-color mode even when the terminal reports truecolor support
tty_theme = False

#* Update time in milliseconds
update_ms = 2000

#* Toggle for showing the init system
show_init = False

#* Toggle for showing OS information
show_os = True

#* Toggle for showing uptime information
show_uptime = True

#* Toggle for showing CPU frequency
show_cpu_freq = True

#* Toggle for showing battery (hidden on desktops without battery)
show_battery = False

#* Toggle for showing temperature readings
check_temp = False

#* Toggle for showing memory information
show_mem = True

#* Toggle for showing swap information
show_swap = True

#* Toggle for showing disk information
show_disks = True

#* Toggle for showing network information
show_net = True

#* Toggle for showing process information
show_proc = True

#* Which boxes to show and in which order (values: cpu, mem, net, proc)
show_boxes = "cpu mem net proc"

#* Graph symbol to use (braille, block, tty)
graph_symbol = "braille"

#* Toggle for showing process tree
proc_tree = False

#* Toggle for gradient colors on process graphs
proc_gradient = True

#* Toggle for showing process memory in bytes instead of percentages
proc_mem_bytes = True

#* The default sorting of processes (values: pid, program, arguments, threads, user, memory, cpu lazy, cpu direct, cpu percent)
proc_sorting = "cpu lazy"

#* Toggle for reverse sorting of processes
proc_reversed = False

#* Temperature scale (celsius, fahrenheit, kelvin)
temp_scale = "celsius"

#* Clock format (strftime format)
clock_format = "%H:%M"

#* Toggle for using base 10 (1000) sizes instead of base 2 (1024)
base_10_sizes = False

#* Networking interface to use (empty = auto-detect)
net_iface = ""

#* Toggle for automatically detecting and syncing the network interface
net_auto = True