# ╔══════════════════════════════════════════════════════════════╗
# ║                    TMUX CONFIGURATION                       ║
# ║         Neovim + Catppuccin Macchiato + Ctrl+A             ║
# ╚══════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

unbind C-b

# Use Ctrl+A as tmux prefix
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Don't automatically rename windows
set -g automatic-rename off
set -g allow-rename off

# Faster key sequences
set -g repeat-time 500


# ─────────────────────────────────────────────
# Terminal / Colors
# ─────────────────────────────────────────────

# 256 color + true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Kill current window
bind x kill-window

# Rename current window
bind R command-prompt -I "#W" "rename-window '%%'"

# Previous / next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Jump directly to windows
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

# Split right
bind | split-window -h -c "#{pane_current_path}"

# Split down
bind - split-window -v -c "#{pane_current_path}"


# ─────────────────────────────────────────────
# Neovim / Tmux Navigation
# ─────────────────────────────────────────────

# Detect Neovim/Vim in the active pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | \
    grep -iqE '^[^TXZ ]+( +|:).*?(n?vim|vim|view)(diff)?(-wrapped)?$'"

# Ctrl+h
bind-key -n C-h if-shell "$is_vim" \
    "send-keys C-h" \
    "select-pane -L"

# Ctrl+j
bind-key -n C-j if-shell "$is_vim" \
    "send-keys C-j" \
    "select-pane -D"

# Ctrl+k
bind-key -n C-k if-shell "$is_vim" \
    "send-keys C-k" \
    "select-pane -U"

# Ctrl+l
bind-key -n C-l if-shell "$is_vim" \
    "send-keys C-l" \
    "select-pane -R"


# ─────────────────────────────────────────────
# Tmux Prefix Navigation
# ─────────────────────────────────────────────

# Ctrl+A + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─────────────────────────────────────────────
# Resize Panes
# ─────────────────────────────────────────────

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ─────────────────────────────────────────────
# Maximize / Restore Pane
# ─────────────────────────────────────────────

bind m resize-pane -Z


# ─────────────────────────────────────────────
# Swap Panes
# ─────────────────────────────────────────────

bind < swap-pane -U
bind > swap-pane -D


# ─────────────────────────────────────────────
# Kill Pane
# ─────────────────────────────────────────────

bind X kill-pane


# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

# Use Vim keys
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Begin selection
bind -T copy-mode-vi v send -X begin-selection

# Rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cancel copy mode
bind -T copy-mode-vi Escape send -X cancel


# ─────────────────────────────────────────────
# Clipboard
# ─────────────────────────────────────────────

set -g set-clipboard on


# ─────────────────────────────────────────────
# Reload Config
# ─────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; \
    display-message "tmux config reloaded"


# ─────────────────────────────────────────────
# Status Bar — Catppuccin Macchiato
# ─────────────────────────────────────────────

set -g status-position bottom

set -g status-style "bg=#24273a,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Left
# ─────────────────────────────────────────────

set -g status-left-length 40

set -g status-left \
    "#[fg=#8aadf4,bold] #S #[fg=#6e738d]│ "


# ─────────────────────────────────────────────
# Window Status
# ─────────────────────────────────────────────

setw -g window-status-format \
    "#[fg=#6e738d] #I:#W "

setw -g window-status-current-format \
    "#[fg=#24273a,bg=#8aadf4,bold] #I:#W "

set -g window-status-separator ""


# ─────────────────────────────────────────────
# Status Right
# ─────────────────────────────────────────────

set -g status-right-length 100

set -g status-right \
    "#[fg=#a6da95] %H:%M #[fg=#6e738d]│ #[fg=#c6a0f6] %d-%b "


# ─────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────

set -g pane-border-style "fg=#363a4f"

set -g pane-active-border-style "fg=#8aadf4"


# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style \
    "bg=#363a4f,fg=#cad3f5"

set -g message-command-style \
    "bg=#363a4f,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Refresh
# ─────────────────────────────────────────────

set -g status-interval 5
