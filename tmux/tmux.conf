# ╔══════════════════════════════════════════════════════════════╗
# ║                    TMUX CONFIGURATION                       ║
# ║              Catppuccin Macchiato + Ctrl+A                 ║
# ╚══════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

# Use Ctrl+A as tmux prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Enable true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Faster command sequences
set -g repeat-time 500

# Don't automatically rename windows
set -g automatic-rename off
set -g allow-rename off


# ─────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────

# Reload configuration (XDG config path; tmux 3.1+)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Create a new window
bind c new-window

# Kill current window
bind x kill-window

# Kill current pane
bind X kill-pane

# Rename current window
bind R command-prompt -I "#W" "rename-window '%%'"

# Switch windows
bind -n M-Left previous-window
bind -n M-Right next-window

# Select windows by number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# ─────────────────────────────────────────────
# Pane Management
# ─────────────────────────────────────────────

# Split horizontally / vertically, keeping the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Maximize / restore current pane
bind m resize-pane -Z

# Swap panes
bind < swap-pane -U
bind > swap-pane -D


# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

# Use vi keys in copy mode
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Start selection
bind -T copy-mode-vi v send -X begin-selection

# Rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selection and exit
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Escape copy mode
bind -T copy-mode-vi Escape send -X cancel


# ─────────────────────────────────────────────
# Clipboard
# ─────────────────────────────────────────────

# Allow tmux to pass through terminal clipboard sequences
set -g set-clipboard on


# ─────────────────────────────────────────────
# Status Bar
# ─────────────────────────────────────────────

# Catppuccin Macchiato
set -g status-position bottom
set -g status-style "bg=#24273a,fg=#cad3f5"

# Left side
set -g status-left-length 40
set -g status-left "#[fg=#8aadf4,bold] #S #[fg=#6e738d]│ "

# Windows
setw -g window-status-format "#[fg=#6e738d] #I:#W "
setw -g window-status-current-format "#[fg=#24273a,bg=#8aadf4,bold] #I:#W "

set -g window-status-separator ""

# Right side
set -g status-right-length 100
set -g status-right "#[fg=#a6da95] %H:%M #[fg=#6e738d]│ #[fg=#c6a0f6] %d-%b "


# ─────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"


# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"


# ─────────────────────────────────────────────
# Status Refresh
# ─────────────────────────────────────────────

set -g status-interval 5
